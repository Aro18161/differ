# 의존성 설치 스크립트 허용 목록 (pnpm 12는 정하지 않은 빌드 스크립트가 있으면 설치를 멈춘다).
allowBuilds:
  # 설치 스크립트는 미리 빌드된 바이너리가 없을 때만 소스 빌드한다. darwin-arm64 바이너리는 optional 의존성으로 들어온다.
  '@parcel/watcher': false
  # 문법 패키지의 Node 네이티브 바인딩은 쓰지 않는다. 함께 들어 있는 .wasm만 web-tree-sitter로 읽는다.
  tree-sitter-javascript: false
  tree-sitter-python: false
  tree-sitter-typescript: false
